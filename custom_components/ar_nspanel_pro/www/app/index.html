/* boot logo (about 6 s, no skip): a rocket bursts into a firework, the logo pops
   out of the burst and holds while the bar fills. The app only starts once the
   firework is over (starting it is heavy and would freeze the sparks); app.js fades this out */
#boot{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483000;background:#080e16;background:radial-gradient(circle at 50% 45%,#10283c 0,#080e16 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;-webkit-transition:opacity .7s;transition:opacity .7s}
#boot.out{opacity:0}
#boot canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
#boot img{width:auto;height:58vh;max-width:70vw;opacity:0;-webkit-transform:scale(.3);transform:scale(.3);-webkit-filter:drop-shadow(0 0 24px rgba(0,150,230,.35));filter:drop-shadow(0 0 24px rgba(0,150,230,.35))}
#boot.pop img{-webkit-animation:bootpop 1.1s cubic-bezier(.2,1.4,.4,1) both;animation:bootpop 1.1s cubic-bezier(.2,1.4,.4,1) both}
#boot .bar{position:absolute;left:30%;right:30%;bottom:9vh;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;z-index:3}
#boot .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#0a7cc4,#2ec3ff);-webkit-transform-origin:0 50%;transform-origin:0 50%;-webkit-animation:bootbar 6s cubic-bezier(.3,.1,.4,1) both;animation:bootbar 6s cubic-bezier(.3,.1,.4,1) both}
#boot small{position:absolute;bottom:4vh;left:0;right:0;text-align:center;font:13px/1.4 sans-serif;letter-spacing:.06em;color:rgba(255,255,255,.45);z-index:3}
@-webkit-keyframes bootpop{0%{opacity:0;-webkit-transform:scale(.3)}35%{opacity:1}100%{opacity:1;-webkit-transform:scale(1)}}
@keyframes bootpop{0%{opacity:0;transform:scale(.3)}35%{opacity:1}100%{opacity:1;transform:scale(1)}}
@-webkit-keyframes bootbar{from{-webkit-transform:scaleX(0)}to{-webkit-transform:scaleX(1)}}
@keyframes bootbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>

  if(lg){var r=lg.getBoundingClientRect();if(r.height){bx=r.left+r.width/2;by=r.top+r.height/2;}}
  var stars=[],i;for(i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.8,r:Math.random()*1.2+0.3,p:Math.random()*6});
  var sp=[],COLS=["#2ec3ff","#7fdcff","#ffffff","#1e8fe0","#2ec3ff","#ffd27a"];
  var rx=bx+(Math.random()-0.5)*W*0.04,burst=false,flash=0,ring=0,t0=window.__bootAt,last=Date.now();
  function frame(){
    if(!b.parentNode)return;
    var now=Date.now(),t=now-t0,dt=Math.min(40,now-last)/16.67,k,e,x,y,gr,p,a,v,R;last=now;
    g.globalCompositeOperation="destination-out";g.fillStyle="rgba(0,0,0,0.22)";g.fillRect(0,0,W,H);
    g.globalCompositeOperation="lighter";
    if(t<END){g.fillStyle="#bfe6ff";for(i=0;i<stars.length;i++){g.globalAlpha=0.25+0.25*Math.sin(stars[i].p+t/400);g.fillRect(stars[i].x,stars[i].y,stars[i].r,stars[i].r);}g.globalAlpha=1;}
    if(!burst&&t>300){
      k=Math.min(1,(t-300)/(BURST-300));e=1-Math.pow(1-k,2.2);
      y=H+10-(H+10-by)*e;x=rx+(bx-rx)*e+Math.sin(t/60)*1.2*s;
      for(i=0;i<3;i++)sp.push({x:x,y:y+4*s,vx:(Math.random()-0.5)*0.6*s,vy:(Math.random()*1.2+0.4)*s,life:1,decay:0.04+Math.random()*0.03,c:i?"#ffcf8a":"#fff",r:1.6*s+0.6});
      gr=g.createRadialGradient(x,y,0,x,y,14*s+4);gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(0.3,"rgba(255,214,150,.8)");gr.addColorStop(1,"rgba(255,170,80,0)");
      g.fillStyle=gr;g.beginPath();g.arc(x,y,14*s+4,0,7);g.fill();
      if(k>=1){burst=true;flash=1;ring=0;R=Math.min(W,H)*0.42*0.035;
        for(i=0;i<170;i++){a=i/170*Math.PI*2+Math.random()*0.05;v=(Math.random()*0.35+0.75)*R*(i%3?1:0.55);
          sp.push({x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:0.012+Math.random()*0.007,c:COLS[(Math.random()*COLS.length)|0],r:(Math.random()*1.4+1.2)*s+0.6,tw:Math.random()<0.35});}
        setTimeout(function(){b.className+=" pop";},200);}
    }
    if(flash>0){R=(60+(1-flash)*260)*s+10;gr=g.createRadialGradient(bx,by,0,bx,by,R);
      gr.addColorStop(0,"rgba(220,245,255,"+(0.55*flash)+")");gr.addColorStop(1,"rgba(46,195,255,0)");g.fillStyle=gr;g.beginPath();g.arc(bx,by,R,0,7);g.fill();flash-=0.045*dt;}
    if(burst&&ring<1){ring+=0.03*dt;g.strokeStyle="rgba(127,220,255,"+(0.5*(1-ring))+")";g.lineWidth=2*s+0.5;g.beginPath();g.arc(bx,by,ring*240*s+20,0,7);g.stroke();}
    for(i=sp.length-1;i>=0;i--){p=sp[i];
      p.vx*=Math.pow(0.965,dt);p.vy=p.vy*Math.pow(0.965,dt)+0.035*s*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=p.decay*dt;
      if(p.life<=0){sp.splice(i,1);continue;}
      g.globalAlpha=Math.max(0,p.life)*(p.tw&&Math.random()<0.3?0.3:1);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r*1.3*(0.6+0.4*p.life),0,7);g.fill();}
    g.globalAlpha=1;
    // firework over: start the app and stop drawing (the stars stay as they are)
    if(burst&&!sp.length&&flash<=0&&ring>=1){go();return;}
    if(started)return;
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);
})();
