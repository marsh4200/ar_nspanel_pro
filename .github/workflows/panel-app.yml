# Builds the panel UI and the Android wrapper APK.
#
#   * every push / PR: build + upload the APK as a workflow artifact
#   * a tag "vX.Y.Z":  also attach  ar-nspanel-pro-X.Y.Z.apk  to the GitHub
#     Release — which is exactly what the config panel's ADB Setup/Update tool
#     installs (const.GITHUB_OWNER / GITHUB_REPO).
#
# Signing uses the key committed at android/signing/release.jks — no secrets to
# set up. Every build is signed with it, so updates install over the app.
name: Panel app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(node -p "require('./panel/package.json').version")-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building $V"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build panel UI
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          npm install --prefix panel --no-audit --no-fund
          node panel/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          V="${{ steps.ver.outputs.version }}"
          gradle -p android assembleRelease -PversionName="$V" -PversionCode="${GITHUB_RUN_NUMBER}" --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ar-nspanel-pro-$V.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ar-nspanel-pro-${{ steps.ver.outputs.version }}
          path: dist/*.apk

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true
